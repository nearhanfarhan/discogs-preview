name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; let a running one finish.
concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  SERVICE: discogs-preview
  REPOSITORY: discogs-preview
  REGION: ${{ vars.GCP_REGION || 'europe-west2' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check the service account key is configured
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "::error::Add your service account key (credentials.json) as the GCP_SA_KEY repository secret. See README → Deploying."
            exit 1
          fi

      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push the image
        env:
          PROJECT_ID: ${{ steps.auth.outputs.project_id }}
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/app:$GITHUB_SHA"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy
        env:
          PROJECT_ID: ${{ steps.auth.outputs.project_id }}
        run: |
          # One instance keeps the in-memory rate limiter and caches consistent; scales to zero when idle.
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --service-account "$SERVICE-run@$PROJECT_ID.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 1 \
            --memory 512Mi \
            --cpu 1 \
            --cpu-boost \
            --timeout 300 \
            --set-secrets "DISCOGS_CONSUMER_KEY=discogs-consumer-key:latest,DISCOGS_CONSUMER_SECRET=discogs-consumer-secret:latest,SESSION_SECRET=session-secret:latest" \
            --quiet

      - name: Summary
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format 'value(status.url)')
          {
            echo "### Deployed :rocket:"
            echo ""
            echo "App: $URL"
            echo ""
            echo "Discogs callback URL: \`$URL/api/auth/discogs/callback\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed to $URL"
